[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-flux"
version = "5.0.0.dev1"
description = "Offline ASCII corpus factory and native glyph-space flow research baseline"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pillow>=11,<13", "opencv-python-headless>=4.11,<5"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=4.57,<5", "huggingface-hub>=0.34,<1", "sentencepiece>=0.2,<1"]
vis = ["pycocotools>=2.0.10,<3", "gdown>=5.2,<6"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
ascii-flux = "ascii_flux.cli:main"

[tool.setuptools.packages.find]
include = ["ascii_flux", "ascii_flux.*"]

[tool.setuptools.package-data]
ascii_flux = ["*.html"]


[tool.pytest.ini_options]
testpaths = ["tests"]

